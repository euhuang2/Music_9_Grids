<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>于峻的音樂九宮格 | Eugene’s Music 9-box Grid</title>
    <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --accent-gold: #d97706;
            --accent-gold-light: #fef3c7;
            --spotify-green: #1DB954;
            --spotify-green-hover: #1ed760;
            --spotify-logged-in: #15803d;
            --spotify-logged-in-hover: #166534;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --btn-bg: #334155;
            --btn-hover: #475569;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        /* 右上角版本號標籤 */
        .version-tag {
            position: fixed; top: 8px; right: 8px;
            font-size: 0.7rem; color: #94a3b8; z-index: 999;
            pointer-events: none; opacity: 0.8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 0;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, var(--theme-color-1, var(--bg-color)), var(--theme-color-2, var(--bg-color)));
            z-index: -1;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        body.detail-mode::before { opacity: 1; }

        .view-section { width: 100%; max-width: 1280px; display: flex; flex-direction: column; align-items: center; }

        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding: 0 0.5rem;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .header-title h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #fef3c7 0%, #d97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header-title p { color: var(--text-secondary); font-size: 1rem; letter-spacing: 1px; }

        /* 專屬控制列（標題與九宮格之間） */
        .control-bar {
            width: 100%;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 0.85rem 1.25rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            backdrop-filter: blur(8px);
        }

        .shuffle-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background-color: var(--btn-bg);
            color: var(--text-primary);
            border: 1px solid var(--accent-gold);
            padding: 0.6rem 1.2rem;
            border-radius: 25px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .shuffle-btn:hover {
            background-color: var(--accent-gold);
            color: #000000;
        }

        /* 隨機播放啟動時的高亮狀態 */
        .shuffle-btn.is-active {
            background-color: var(--accent-gold);
            color: #000000;
            box-shadow: 0 0 15px rgba(217, 119, 6, 0.5);
            animation: pulse-glow 2s infinite;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 10px rgba(217, 119, 6, 0.4); }
            50% { box-shadow: 0 0 20px rgba(217, 119, 6, 0.8); }
            100% { box-shadow: 0 0 10px rgba(217, 119, 6, 0.4); }
        }

        .now-playing-banner {
            display: none;
            align-items: center;
            justify-content: space-between;
            background: rgba(217, 119, 6, 0.15);
            border: 1px solid rgba(217, 119, 6, 0.4);
            border-radius: 8px;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            color: var(--accent-gold-light);
            flex-grow: 1;
        }

        .now-playing-banner.is-visible {
            display: flex;
        }

        .now-playing-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-weight: 600;
        }

        .close-shuffle-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 0.85rem;
            cursor: pointer;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            transition: color 0.2s;
        }

        .close-shuffle-btn:hover {
            color: #ffffff;
        }

        .detail-header-bar {
            width: 100%;
            display: none;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .bottom-nav { width: 100%; display: none; justify-content: center; margin-top: 1rem; margin-bottom: 2rem; }

        .spotify-login-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background-color: var(--spotify-green);
            color: #000000;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 0.65rem 1.4rem;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(29, 185, 84, 0.25);
            cursor: pointer;
        }
        .spotify-login-btn:hover { background-color: var(--spotify-green-hover); transform: translateY(-2px); }
        .spotify-login-btn.is-logged-in { background-color: var(--spotify-logged-in); color: #ffffff; }
        .spotify-login-btn svg { width: 20px; height: 20px; }

        .back-btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            background-color: var(--btn-bg); color: var(--text-primary);
            border: 1px solid var(--card-border); padding: 0.65rem 1.4rem;
            border-radius: 30px; font-size: 0.95rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s ease;
        }
        .back-btn:hover { background-color: var(--btn-hover); border-color: var(--accent-gold); color: var(--accent-gold-light); }

        .enter-btn {
            display: inline-flex; align-items: center; gap: 0.3rem;
            background-color: rgba(217, 119, 6, 0.15); color: var(--accent-gold-light);
            border: 1px solid rgba(217, 119, 6, 0.4); padding: 0.35rem 0.8rem;
            border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }
        .enter-btn:hover { background-color: var(--accent-gold); color: #000; }

        .grid-container { display: grid; gap: 1.5rem; width: 100%; }

        /* 寬螢幕自定義排列 (左789 中456 右123) */
        @media (min-width: 768px) {
            .grid-container { grid-template-columns: repeat(3, 1fr); }
            .grid-card[data-id="7"] { order: 1; }
            .grid-card[data-id="4"] { order: 2; }
            .grid-card[data-id="1"] { order: 3; }
            .grid-card[data-id="8"] { order: 4; }
            .grid-card[data-id="5"] { order: 5; }
            .grid-card[data-id="2"] { order: 6; }
            .grid-card[data-id="9"] { order: 7; }
            .grid-card[data-id="6"] { order: 8; }
            .grid-card[data-id="3"] { order: 9; }
        }

        .grid-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            padding: 0.85rem 1rem;
            background: rgba(15, 23, 42, 0.7);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .card-header-left { 
            display: flex; 
            align-items: center; 
            overflow: hidden; 
            min-width: 0; 
        }

        /* 移除英文後，放大中文名稱字體 */
        .card-title-zh { 
            font-size: 1.3rem; 
            font-weight: 700; 
            color: var(--text-primary); 
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .iframe-container { width: 100%; height: 380px; transition: height 0.3s ease; background-color: #000; }
        .iframe-container iframe { width: 100% !important; height: 100% !important; border: none; }

        body.detail-mode .grid-card.is-active {
            border-color: var(--accent-gold);
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            order: initial !important;
        }

        body.detail-mode .grid-card.is-active .enter-btn { display: none !important; }

        body.detail-mode .grid-card.is-active .iframe-container {
            height: 600px;
            min-height: 450px;
        }

        @media (max-width: 768px) {
            body.detail-mode .grid-card.is-active .iframe-container { height: 70vh; }
        }

        body.detail-mode .grid-container { display: block; }
        body.detail-mode .grid-card:not(.is-active) { display: none !important; }
        body.detail-mode header, body.detail-mode .control-bar, body.detail-mode .premium-tip-banner { display: none; }
        body.detail-mode .detail-header-bar, body.detail-mode .bottom-nav { display: flex; }

        /* 提示區域背景與高對比白字 */
        .premium-tip-banner {
            width: 100%;
            background-color: rgba(30, 41, 59, 0.95);
            border: 1px solid rgba(217, 119, 6, 0.5);
            border-radius: 12px;
            padding: 0.85rem 1.25rem;
            margin-top: 2rem;
            font-size: 0.9rem;
            color: #ffffff;
            line-height: 1.6;
        }

        .premium-tip-banner a {
            color: #fbbf24;
            font-weight: 600;
            text-decoration: underline;
            text-underline-offset: 3px;
            transition: color 0.2s ease;
        }

        .premium-tip-banner a:hover {
            color: #ffffff;
        }

        /* 白色 Spotify 圖示 */
        .inline-spotify-icon {
            width: 16px;
            height: 16px;
            fill: #ffffff;
            vertical-align: text-bottom;
            display: inline-block;
            margin: 0 2px;
        }
    </style>
</head>
<body>
    <div class="version-tag">v1.17</div>

    <section class="view-section">
        <header>
            <div class="header-title">
                <h1>于峻的音樂九宮格</h1>
                <p>九種情緒語境與音樂氛圍的對應</p>
            </div>
            <a href="https://accounts.spotify.com/login?continue=https%3A%2F%2Fopen.spotify.com" target="_blank" rel="noopener noreferrer" class="spotify-login-btn" onclick="handleSpotifyLogin(event)">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141 C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.18-1.2-.18-1.38-.72-.18-.6.18-1.2.72-1.38 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
                <span class="spotify-btn-text">登入 Spotify</span>
            </a>
        </header>

        <!-- 專屬控制列（主標題與九宮格之間） -->
        <div class="control-bar">
            <button class="shuffle-btn" id="shuffle-btn" onclick="toggleShuffleMode()">
                <span id="shuffle-btn-icon">🔀</span>
                <span id="shuffle-btn-text">跨宮格隨機播放</span>
            </button>

            <div class="now-playing-banner" id="now-playing-banner">
                <div class="now-playing-info">
                    <span>♫ 跨宮格隨機電台播放中 ── 正在播放：</span>
                    <span id="now-playing-target" style="color: #ffffff;">[4 - 活潑暢意]</span>
                </div>
                <button class="close-shuffle-btn" onclick="toggleShuffleMode(false)" title="關閉隨機播放">✕ 關閉隨機</button>
            </div>
        </div>

        <div class="detail-header-bar">
            <button class="back-btn" onclick="showMainView()"><span>← 回到九宮格</span></button>
            <a href="https://accounts.spotify.com/login?continue=https%3A%2F%2Fopen.spotify.com" target="_blank" rel="noopener noreferrer" class="spotify-login-btn" onclick="handleSpotifyLogin(event)">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141 C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.18-1.2-.18-1.38-.72-.18-.6.18-1.2.72-1.38 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
                <span class="spotify-btn-text">登入 Spotify</span>
            </a>
        </div>

        <main class="grid-container" id="grid-container"></main>

        <div class="bottom-nav">
            <button class="back-btn" onclick="showMainView()"><span>← 回到九宮格</span></button>
        </div>

        <div class="premium-tip-banner">
            <span>🎵 <strong>播放全曲提示：</strong> 未訂閱 Spotify Premium 方案者僅能預覽聆聽 30 秒。欲聆聽全曲請先至 <a href="https://open.spotify.com" target="_blank" rel="noopener noreferrer">open.spotify.com</a> 登入；若登入後仍無法全曲播放，建議直接點擊<svg class="inline-spotify-icon" viewBox="0 0 24 24"><path d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141 C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.18-1.2-.18-1.38-.72-.18-.6.18-1.2.72-1.38 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>，即可至 Spotify App 上聆聽完整曲目。</span>
        </div>
    </section>

    <script>
        // 九宮格資料：各卡片背景色系重新調配，確保 9 個各自獨立不重複
        const musicGrids = [
            { id: 1, titleZh: "1 - 振奮激昂", playlistId: "5d38UvPsiuwEpHEKsmNVdI", colors: ['#7c2d12', '#ea580c'] }, // 熱烈暖橘紅
            { id: 2, titleZh: "2 - 雄偉莊嚴", playlistId: "2FzUomeuPcmzRF0XrowXLJ", colors: ['#78350f', '#d97706'] }, // 輝煌琥珀金
            { id: 3, titleZh: "3 - 壯烈凝重", playlistId: "6qidqEVx0KCNldfcvM9Ba0", colors: ['#450a0a', '#1e1b4b'] }, // 深邃暗紅靛紫
            { id: 4, titleZh: "4 - 活潑暢意", playlistId: "4EOtag4cS0bYD33FTBdt0i", colors: ['#065f46', '#10b981'] }, // 活力翠綠
            { id: 5, titleZh: "5 - 中庸從容", playlistId: "4duwZFg9Zjhd1zwPeFzlN6", colors: ['#1e293b', '#475569'] }, // 穩重灰藍
            { id: 6, titleZh: "6 - 深沈濃郁", playlistId: "1t9JYd54G0ujqBugxXSd9N", colors: ['#4c1d95', '#8b5cf6'] }, // 濃郁魅惑紫
            { id: 7, titleZh: "7 - 輕鬆愉悅", playlistId: "1oc9yD41QwnNEgy4czd6TD", colors: ['#0284c7', '#38bdf8'] }, // 明亮天藍
            { id: 8, titleZh: "8 - 悠揚舒緩", playlistId: "12f2AeitLAxtpDosZJvILN", colors: ['#134e4a', '#0d9488'] }, // 寧靜湖水綠
            { id: 9, titleZh: "9 - 低迴沉吟", playlistId: "1q12bVnZ2KLXXCGaCmqooW", colors: ['#0f172a', '#1e1b4b'] }  // 夜空極暗藍
        ];

        const controllers = new Map();
        let isShuffleActive = false;
        let currentShuffleId = null;

        function stopAllOthers(activeId) {
            controllers.forEach((ctrl, id) => {
                if (id !== activeId && ctrl) {
                    try {
                        ctrl.pause();
                    } catch (err) {
                        console.log('Pause error:', err);
                    }
                }
            });
        }

        // 跨宮格隨機播放切換邏輯
        function toggleShuffleMode(forceState = null) {
            isShuffleActive = (forceState !== null) ? forceState : !isShuffleActive;

            const btn = document.getElementById('shuffle-btn');
            const btnIcon = document.getElementById('shuffle-btn-icon');
            const btnText = document.getElementById('shuffle-btn-text');
            const banner = document.getElementById('now-playing-banner');
            const targetText = document.getElementById('now-playing-target');

            if (isShuffleActive) {
                // 隨機選擇一個宮格
                const randomItem = musicGrids[Math.floor(Math.random() * musicGrids.length)];
                currentShuffleId = randomItem.id;

                btn.classList.add('is-active');
                btnIcon.innerText = '⏸';
                btnText.innerText = '隨機播放中（點擊取消）';

                targetText.innerText = `[${randomItem.titleZh}]`;
                banner.classList.add('is-visible');

                // 播放對應的宮格曲目
                stopAllOthers(randomItem.id);
                const targetCtrl = controllers.get(randomItem.id);
                if (targetCtrl) {
                    targetCtrl.play();
                }
            } else {
                btn.classList.remove('is-active');
                btnIcon.innerText = '🔀';
                btnText.innerText = '跨宮格隨機播放';
                banner.classList.remove('is-visible');

                // 關閉隨機時暫停當前播放
                if (currentShuffleId !== null) {
                    const activeCtrl = controllers.get(currentShuffleId);
                    if (activeCtrl) {
                        try { activeCtrl.pause(); } catch(e){}
                    }
                    currentShuffleId = null;
                }
            }
        }

        function updateSpotifyLoginUI(isLoggedIn) {
            const btns = document.querySelectorAll('.spotify-login-btn');
            btns.forEach(btn => {
                const textSpan = btn.querySelector('.spotify-btn-text');
                if (isLoggedIn) {
                    btn.classList.add('is-logged-in');
                    if (textSpan) textSpan.innerText = '已登入 Spotify';
                    btn.title = '您已登入，點擊可管理帳號或切換登出';
                } else {
                    btn.classList.remove('is-logged-in');
                    if (textSpan) textSpan.innerText = '登入 Spotify';
                    btn.title = '點擊登入 Spotify Premium 帳號以聽全曲';
                }
            });
        }

        function checkSpotifyLoginState() {
            const isLoggedIn = localStorage.getItem('spotify_is_logged_in') === 'true';
            updateSpotifyLoginUI(isLoggedIn);
        }

        function handleSpotifyLogin(e) {
            const isLoggedIn = localStorage.getItem('spotify_is_logged_in') === 'true';
            if (!isLoggedIn) {
                localStorage.setItem('spotify_is_logged_in', 'true');
                updateSpotifyLoginUI(true);
            } else {
                e.preventDefault();
                const choice = confirm("您目前顯示為「已登入 Spotify」。\n\n【確定】：前往 Spotify 帳號管理頁面\n【取消】：切換標記為「登出」");
                if (choice) {
                    window.open('https://www.spotify.com/account/overview/', '_blank');
                } else {
                    localStorage.removeItem('spotify_is_logged_in');
                    updateSpotifyLoginUI(false);
                }
            }
        }

        function renderMainGrid() {
            const container = document.getElementById('grid-container');
            if (!container) return;
            container.innerHTML = musicGrids.map(item => `
                <div class="grid-card" data-id="${item.id}">
                    <div class="card-header">
                        <div class="card-header-left">
                            <span class="card-title-zh" title="${item.titleZh}">${item.titleZh}</span>
                        </div>
                        <button class="enter-btn" onclick="enterGrid(${item.id})">
                            進入 ➔
                        </button>
                    </div>
                    <div class="iframe-container" id="embed-container-${item.id}"></div>
                </div>
            `).join('');
        }

        renderMainGrid();
        checkSpotifyLoginState();

        window.onSpotifyIframeApiReady = (IFrameAPI) => {
            musicGrids.forEach(item => {
                const element = document.getElementById(`embed-container-${item.id}`);
                if (!element) return;

                const options = {
                    width: '100%',
                    height: '380',
                    uri: `spotify:playlist:${item.playlistId}`
                };

                const callback = (EmbedController) => {
                    controllers.set(item.id, EmbedController);
                    
                    EmbedController.addListener('playback_update', e => {
                        if (e.data && !e.data.isPaused) {
                            stopAllOthers(item.id);
                        }
                    });
                };

                IFrameAPI.createController(element, options, callback);
            });
        };

        function enterGrid(id) {
            document.querySelectorAll('.grid-card').forEach(card => {
                card.classList.remove('is-active');
            });

            const targetCard = document.querySelector(`.grid-card[data-id="${id}"]`);
            if (targetCard) {
                targetCard.classList.add('is-active');
            }

            const gridData = musicGrids.find(item => item.id === id);
            if (gridData && gridData.colors) {
                document.documentElement.style.setProperty('--theme-color-1', gridData.colors[0]);
                document.documentElement.style.setProperty('--theme-color-2', gridData.colors[1]);
            }

            document.body.classList.add('detail-mode');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showMainView() {
            document.body.classList.remove('detail-mode');
            document.querySelectorAll('.grid-card').forEach(card => {
                card.classList.remove('is-active');
            });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
