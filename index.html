<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>于峻的音樂九宮格 | Yu Jun's Music Grid</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --accent-gold: #d97706;
            --accent-gold-light: #fef3c7;
            --spotify-green: #1DB954;
            --spotify-green-hover: #1ed760;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            max-width: 1280px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2.5rem;
            padding: 0 0.5rem;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .header-title {
            text-align: left;
        }

        .header-title h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fef3c7 0%, #d97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-title p {
            color: var(--text-secondary);
            font-size: 1rem;
            letter-spacing: 1px;
        }

        /* Spotify Login Button */
        .spotify-login-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background-color: var(--spotify-green);
            color: #000000;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 0.65rem 1.4rem;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(29, 185, 84, 0.25);
        }

        .spotify-login-btn:hover {
            background-color: var(--spotify-green-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(29, 185, 84, 0.4);
        }

        .spotify-login-btn svg {
            width: 20px;
            height: 20px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.5rem;
            width: 100%;
            max-width: 1280px;
        }

        @media (max-width: 1024px) {
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 640px) {
            header {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .header-title {
                text-align: center;
            }
            .grid-container {
                grid-template-columns: 1fr;
            }
        }

        .grid-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .grid-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 30px -10px rgba(217, 119, 6, 0.2);
            border-color: rgba(217, 119, 6, 0.5);
        }

        .card-header {
            padding: 1rem 1.25rem;
            background: rgba(15, 23, 42, 0.6);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-number {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-gold);
            background-color: rgba(217, 119, 6, 0.15);
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 1px;
        }

        .iframe-container {
            width: 100%;
            height: 380px;
            background-color: #000;
        }

        .iframe-container div {
            width: 100%;
            height: 100%;
        }

        footer {
            margin-top: 3rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
            border-top: 1px solid var(--card-border);
            padding-top: 1.5rem;
            width: 100%;
            max-width: 1280px;
        }
    </style>
</head>
<body>

    <!-- Spotify IFrame API Script -->
    <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
    <script>
        const controllers = [];
        let activeController = null;

        window.onSpotifyIframeApiReady = (IFrameAPI) => {
            const embedContainers = document.querySelectorAll('.spotify-embed');

            embedContainers.forEach((container) => {
                const options = {
                    uri: container.dataset.spotifyUri,
                    width: '100%',
                    height: '380'
                };

                IFrameAPI.createController(container, options, (EmbedController) => {
                    controllers.push(EmbedController);

                    EmbedController.addListener('playback_update', (e) => {
                        if (e.data && !e.data.isPaused) {
                            if (activeController && activeController !== EmbedController) {
                                activeController.pause();
                            }
                            activeController = EmbedController;
                        }
                    });
                });
            });
        };
    </script>
