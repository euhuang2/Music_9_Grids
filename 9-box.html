<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>九宮格音樂與情緒矩陣</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 900px;
            width: 100%;
        }

        .axis-label-top {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .main-layout {
            display: flex;
            align-items: center;
            width: 100%;
        }

        .axis-label-left {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            margin-right: 15px;
            letter-spacing: 1px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            flex-grow: 1;
            aspect-ratio: 1 / 1;
            max-width: 750px;
        }

        .grid-card {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), 
                        box-shadow 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
        }

        .grid-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .grid-number {
            font-size: 0.85rem;
            color: #888;
            position: absolute;
            top: 12px;
            left: 12px;
        }

        .grid-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .grid-subtitle {
            font-size: 0.9rem;
            color: #666;
            line-height: 1.4;
        }

        /* 優雅緩慢出現的 Pop-up 彈窗 */
        .popup-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            /* 延長淡入時間並使用優雅曲線 */
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), 
                        visibility 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 1000;
        }

        .popup-backdrop.active {
            opacity: 1;
            visibility: visible;
        }

        .popup-content {
            background: #ffffff;
            padding: 30px 35px;
            border-radius: 16px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            transform: scale(0.92) translateY(15px);
            /* 彈窗出現動畫改為 0.6 秒的漸進優雅曲線 */
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), 
                        opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 0;
            position: relative;
        }

        .popup-backdrop.active .popup-content {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .popup-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1a252f;
            margin-bottom: 12px;
        }

        .popup-text {
            font-size: 1rem;
            color: #4a5568;
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .close-btn {
            background-color: #2c3e50;
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            float: right;
            transition: background-color 0.3s ease;
        }

        .close-btn:hover {
            background-color: #1a252f;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 頂部橫軸名稱 -->
        <div class="axis-label-top">橫軸速度</div>

        <div class="main-layout">
            <!-- 左側縱軸名稱 -->
            <div class="axis-label-left">縱軸情感</div>

            <!-- 3x3 九宮格 -->
            <div class="grid-container">
                <div class="grid-card" onclick="openPopup('宮格 1', '此區域代表高節奏與高強度的情緒表達。')">
                    <span class="grid-number">01</span>
                    <div class="grid-title">激昂奔放</div>
                    <div class="grid-subtitle">快速度 × 強烈情緒</div>
                </div>
                <div class="grid-card" onclick="openPopup('宮格 2', '此區域代表節奏輕快且情緒明朗的特質。')">
                    <span class="grid-number">02</span>
                    <div class="grid-title">歡快明亮</div>
                    <div class="grid-subtitle">快速度 × 中性情緒</div>
                </div>
                <div class="grid-card" onclick="openPopup('宮格 3', '此區域代表速度快但情感較為內斂或低沉。')">
                    <span class="grid-number">03</span>
                    <div class="grid-title">緊湊暗湧</div>
                    <div class="grid-subtitle">快速度 × 沉穩情緒</div>
                </div>
                <div class="grid-card" onclick="openPopup('宮格 4', '此區域呈現中等速度與充滿張力的情緒。')">
                    <span class="grid-number">04</span>
                    <div class="grid-title">澎湃抒情</div>
                    <div class="grid-subtitle">中速度 × 強烈情緒</div>
                </div>
                <div class="grid-card" onclick="openPopup('宮格 5', '此區域為平衡核心，展現穩定且緩和的節奏與情緒。')">
                    <span class="grid-number">05</span>
                    <div class="grid-title">行雲流水</div>
                    <div class="grid-subtitle">中速度 × 中性情緒</div>
                </div>
                <div class="grid-card" onclick="openPopup('宮格 6', '此區域充滿敘事感，速度適中而內涵深沉。')">
                    <span class="grid-number">06</span>
                    <div class="grid-title">深情凝練</div>
                    <div class="grid-subtitle">中速度 × 沉穩情緒</div>
                </div>
                <div class="grid-card" onclick="openPopup('宮格 7', '此區域節奏舒緩，帶有濃厚且愉快情緒的感染力。')">
                    <span class="grid-number">07</span>
                    <div class="grid-title">溫柔頌歌</div>
                    <div class="grid-subtitle">慢速度 × 愉快情緒</div>
                </div>
                <div class="grid-card" onclick="openPopup('宮格 8', '此區域平穩寧靜，適合放鬆與沉澱。')">
                    <span class="grid-number">08</span>
                    <div class="grid-title">恬淡寧靜</div>
                    <div class="grid-subtitle">慢速度 × 中性情緒</div>
                </div>
                <div class="grid-card" onclick="openPopup('靜謐沉吟', '此區域展現慢速度與深沉愉快情緒的極致結合。')">
                    <span class="grid-number">09</span>
                    <div class="grid-title">靜謐沉吟</div>
                    <div class="grid-subtitle">慢速度 × 愉快情緒</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Pop-up 彈窗 HTML Structure -->
    <div class="popup-backdrop" id="popupBackdrop" onclick="closePopupOuter(event)">
        <div class="popup-content">
            <div class="popup-title" id="popupTitle">名稱</div>
            <div class="popup-text" id="popupText">詳細內容說明...</div>
            <button class="close-btn" onclick="closePopup()">關閉</button>
        </div>
    </div>

    <script>
        function openPopup(title, text) {
            document.getElementById('popupTitle').innerText = title;
            document.getElementById('popupText').innerText = text;
            document.getElementById('popupBackdrop').classList.add('active');
        }

        function closePopup() {
            document.getElementById('popupBackdrop').classList.remove('active');
        }

        function closePopupOuter(event) {
            if (event.target === document.getElementById('popupBackdrop')) {
                closePopup();
            }
        }
    </script>
</body>
</html>
