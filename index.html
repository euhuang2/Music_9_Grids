<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>于峻的音樂九宮格 | Yu Jun's Music Grid</title>
    <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --card-border: #334155;
            --accent-gold: #d97706;
            --accent-gold-light: #fef3c7;
            --spotify-green: #1DB954;
            --spotify-green-hover: #1ed760;
            --spotify-logged-in: #15803d;
            --spotify-logged-in-hover: #166534;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --btn-bg: #334155;
            --btn-hover: #475569;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 0;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, var(--theme-color-1, var(--bg-color)), var(--theme-color-2, var(--bg-color)));
            z-index: -1;
            opacity: 0;
            transition: opacity 0.8s ease;
        }

        body.detail-mode::before { opacity: 1; }

        .view-section { width: 100%; max-width: 1280px; display: flex; flex-direction: column; align-items: center; }

        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding: 0 0.5rem;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .header-title h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            background: linear-gradient(135deg, #fef3c7 0%, #d97706 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .header-title p { color: var(--text-secondary); font-size: 1rem; letter-spacing: 1px; }

        .detail-header-bar {
            width: 100%;
            display: none;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .bottom-nav { width: 100%; display: none; justify-content: center; margin-top: 1rem; margin-bottom: 2rem; }

        .spotify-login-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            background-color: var(--spotify-green);
            color: #000000;
            font-weight: 700;
            font-size: 0.95rem;
            padding: 0.65rem 1.4rem;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(29, 185, 84, 0.25);
            cursor: pointer;
        }
        .spotify-login-btn:hover { background-color: var(--spotify-green-hover); transform: translateY(-2px); }
        .spotify-login-btn.is-logged-in { background-color: var(--spotify-logged-in); color: #ffffff; }
        .spotify-login-btn svg { width: 20px; height: 20px; }

        .back-btn {
            display: inline-flex; align-items: center; gap: 0.5rem;
            background-color: var(--btn-bg); color: var(--text-primary);
            border: 1px solid var(--card-border); padding: 0.65rem 1.4rem;
            border-radius: 30px; font-size: 0.95rem; font-weight: 600;
            cursor: pointer; transition: all 0.2s ease;
        }
        .back-btn:hover { background-color: var(--btn-hover); border-color: var(--accent-gold); color: var(--accent-gold-light); }

        .enter-btn {
            display: inline-flex; align-items: center; gap: 0.3rem;
            background-color: rgba(217, 119, 6, 0.15); color: var(--accent-gold-light);
            border: 1px solid rgba(217, 119, 6, 0.4); padding: 0.35rem 0.8rem;
            border-radius: 20px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
            transition: all 0.2s ease;
        }
        .enter-btn:hover { background-color: var(--accent-gold); color: #000; }

        .grid-container { display: grid; gap: 1.5rem; width: 100%; }

        @media (min-width: 768px) {
            .grid-container { grid-template-columns: repeat(3, 1fr); }
        }

        .grid-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            padding: 0.85rem 1.25rem;
            background: rgba(15, 23, 42, 0.7);
            border-bottom: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .card-number { font-size: 0.8rem; font-weight: 700; color: var(--accent-gold); background-color: rgba(217, 119, 6, 0.15); padding: 0.2rem 0.55rem; border-radius: 20px; }
        .card-title { font-size: 1.05rem; font-weight: 600; color: var(--text-primary); }

        /* iframe 設定 */
        .iframe-container { width: 100%; height: 380px; transition: height 0.3s ease; }
        .iframe-container iframe { width: 100% !important; height: 100% !important; border: none; }

        /* v1.03: 優化展開後的排版 */
        body.detail-mode .grid-card.is-active {
            border-color: var(--accent-gold);
            width: 100%;
            max-width: 900px; /* 限制寬度，讓播放器看起來更精緻不拉伸 */
            margin: 0 auto;
        }

        body.detail-mode .grid-card.is-active .iframe-container {
            height: 600px; /* 設定為專業播放器常用的固定高度 */
            min-height: 450px;
        }

        @media (max-width: 768px) {
            body.detail-mode .grid-card.is-active .iframe-container {
                height: 70vh; /* 手機端自動適應高度 */
            }
        }

        body.detail-mode .grid-container { display: block; }
        body.detail-mode .grid-card:not(.is-active) { display: none !important; }
        body.detail-mode header, body.detail-mode .premium-tip-banner { display: none; }
        body.detail-mode .detail-header-bar, body.detail-mode .bottom-nav { display: flex; }

        .premium-tip-banner {
            width: 100%;
            background-color: rgba(217, 119, 6, 0.1);
            border: 1px solid rgba(217, 119, 6, 0.3);
            border-radius: 12px;
            padding: 0.75rem 1.25rem;
            margin-top: 2rem;
            font-size: 0.88rem;
            color: var(--accent-gold-light);
        }

        footer {
            margin-top: 2rem;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
            border-top: 1px solid var(--card-border);
            padding-top: 1.5rem;
            width: 100%;
        }
    </style>
</head>
<body>

    <section class="view-section">
        <header>
            <div class="header-title">
                <h1>于峻的音樂九宮格</h1>
                <p>九種情緒語境與音樂氛圍的對應</p>
            </div>
            <a href="https://accounts.spotify.com/login" target="_blank" rel="noopener noreferrer" class="spotify-login-btn" onclick="handleSpotifyLogin(event)">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.376 0 0 5.376 0 12s5.376 12 12 12 12-5.376 12-12S18.624 0 12 0zm5.521 17.34c-.24.359-.66.48-1.021.24-2.82-1.74-6.36-2.101-10.561-1.141-.418.122-.779-.179-.899-.539-.12-.421.18-.78.54-.9 4.56-1.021 8.52-.6 11.64 1.32.42.18.479.659.301 1.02zm1.44-3.3c-.301.42-.841.6-1.262.3-3.239-1.98-8.159-2.58-11.939-1.38-.479.12-1.02-.12-1.14-.6-.12-.48.12-1.021.6-1.141 C9.6 9.9 15 10.561 18.72 12.84c.361.181.54.78.241 1.2zm.12-3.36C15.24 8.4 8.82 8.16 5.16 9.301c-.6.18-1.2-.18-1.38-.72-.18-.6.18-1.2.72-1.38 4.26-1.26 11.28-1.02 15.721 1.621.539.3.719 1.02.419 1.56-.299.421-1.02.599-1.559.3z"/></svg>
                <span class="spotify-btn-text">登入 Spotify</span>
            </a>
        </header>

        <div class="detail-header-bar">
            <button class="back-btn" onclick="showMainView()"><span>← 回到九宮格</span></button>
        </div>

        <main class="grid-container" id="grid-container"></main>

        <div class="bottom-nav">
            <button class="back-btn" onclick="showMainView()"><span>← 回到九宮格</span></button>
        </div>

        <div class="premium-tip-banner">
            <span>🎵 <strong>播放全曲提示：</strong> 請點擊「登入 Spotify」或先在同一瀏覽器前往 <a href="https://open.spotify.com" target="_blank" rel="noopener noreferrer">open.spotify.com</a> 登入，並確保瀏覽器未阻擋第三方跨網域 Cookie（如設定為「允許跨網站追蹤」）。</span>
        </div>
    </section>

    <footer>
        <p>© 于峻的音樂九宮格網頁互動版 (v1.03)</p>
    </footer>

    <script>
        const musicGrids = [
            { id: 1, num: "GRID 01", title: "1 - 振奮激昂", playlistId: "5d38UvPsiuwEpHEKsmNVdI", colors: ['#450a0a', '#9a3412'] },
            { id: 2, num: "GRID 02", title: "2 - 雄偉莊嚴", playlistId: "2FzUomeuPcmzRF0XrowXLJ", colors: ['#172554', '#78350f'] },
            { id: 3, num: "GRID 03", title: "3 - 壯烈凝重", playlistId: "6qidqEVx0KCNldfcvM9Ba0", colors: ['#0c0a09', '#450a0a'] },
            { id: 4, num: "GRID 04", title: "4 - 活潑暢意", playlistId: "4EOtag4cS0bYD33FTBdt0i", colors: ['#042f2e', '#0369a1'] },
            { id: 5, num: "GRID 05", title: "5 - 中庸從容", playlistId: "4duwZFg9Zjhd1zwPeFzlN6", colors: ['#1e293b', '#334155'] },
            { id: 6, num: "GRID 06", title: "6 - 深沈濃郁", playlistId: "1t9JYd54G0ujqBugxXSd9N", colors: ['#2e1065', '#111827'] },
            { id: 7, num: "GRID 07", title: "7 - 輕鬆愉悅", playlistId: "1oc9yD41QwnNEgy4czd6TD", colors: ['#1e3a8a', '#0891b2'] },
            { id: 8, num: "GRID 08", title: "8 - 悠揚舒緩", playlistId: "12f2AeitLAxtpDosZJvILN", colors: ['#312e81', '#4c1d95'] },
            { id: 9, num: "GRID 09", title: "9 - 低迴沉吟", playlistId: "1q12bVnZ2KLXXCGaCmqooW", colors: ['#020617', '#1e293b'] }
        ];

        const controllers = new Map();

        function renderMainGrid() {
            const container = document.getElementById('grid-container');
            container.innerHTML = musicGrids.map(item => `
                <div class="grid-card" data-id="${item.id}">
                    <div class="card-header">
                        <div class="card-header-left">
                            <span class="card-number">${item.num}</span>
                            <span class="card-title">${item.title}</span>
                        </div>
                        <button class="enter-btn" onclick="enterGrid(${item.id})">進入 ➔</button>
                    </div>
                    <div class="iframe-container" id="embed-container-${item.id}"></div>
                </div>
            `).join('');
        }

        renderMainGrid();

        window.onSpotifyIframeApiReady = (IFrameAPI) => {
            musicGrids.forEach(item => {
                const element = document.getElementById(`embed-container-${item.id}`);
                const options = { width: '100%', height: '380', uri: `spotify:playlist:${item.playlistId}` };
                IFrameAPI.createController(element, options, (EmbedController) => {
                    controllers.set(item.id, EmbedController);
                });
            });
        };

        function enterGrid(id) {
            document.querySelectorAll('.grid-card').forEach(card => card.classList.remove('is-active'));
            const targetCard = document.querySelector(`.grid-card[data-id="${id}"]`);
            targetCard.classList.add('is-active');
            
            const gridData = musicGrids.find(item => item.id === id);
            document.documentElement.style.setProperty('--theme-color-1', gridData.colors[0]);
            document.documentElement.style.setProperty('--theme-color-2', gridData.colors[1]);
            document.body.classList.add('detail-mode');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showMainView() {
            document.body.classList.remove('detail-mode');
            document.querySelectorAll('.grid-card').forEach(card => card.classList.remove('is-active'));
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 簡單的登入狀態模擬
        const loginBtn = document.querySelectorAll('.spotify-login-btn');
        loginBtn.forEach(btn => btn.addEventListener('click', (e) => {
            localStorage.setItem('spotify_is_logged_in', 'true');
            btn.querySelector('.spotify-btn-text').innerText = '已登入 Spotify';
        }));
    </script>
</body>
</html>
